[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barcodemapper"
version = "1.2.1"
description = "Map paired shotgun reads to COI and ITS reference sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Antton Alberdi", email = "antton.alberdi@sund.ku.dk" }]
keywords = ["bioinformatics", "COI", "ITS", "shotgun sequencing", "taxonomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas",
    "PyYAML",
    "biopython",
    "pysam",
    "plotly",
]

[project.scripts]
barcodemapper = "barcodemapper.cli:main"

[project.urls]
Documentation = "https://barcodemapper.readthedocs.io"
Repository = "https://github.com/alberdilab/barcodemapper"
Issues = "https://github.com/alberdilab/barcodemapper/issues"

[tool.setuptools.packages.find]
include = ["barcodemapper*"]

[tool.setuptools.package-data]
barcodemapper = [
    "workflow/Snakefile",
    "workflow/config.yaml",
    "workflow/scripts/*.py",
    "profile/local/config.yaml",
    "profile/slurm/config.yaml",
]

[tool.pytest.ini_options]
markers = ["integration: requires Snakemake, Bowtie2, samtools and/or fastp"]
