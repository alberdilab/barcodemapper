name: Dependency check

# Weekly: build an environment from the latest releases of every pinned
# dependency, then run the test suite and the regression check against it.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report pinned versus latest
        run: python3 scripts/check_dependencies.py --write-candidate candidate.yml
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: candidate.yml
          init-shell: bash
      - name: Install BarcodeMapper and pytest
        shell: bash -el {0}
        run: |
          python -m pip install --no-deps .
          python -m pip install pytest
      - name: Show installed versions
        shell: bash -el {0}
        run: micromamba list | grep -E '^ *(python|snakemake|fastp|samtools|bowtie2|numpy|pandas|plotly|biopython|pysam|pyyaml) '
      - name: Unit and end-to-end tests
        shell: bash -el {0}
        run: python -m pytest -q
      - name: Regression check (results must match the golden table)
        shell: bash -el {0}
        run: python scripts/regression_check.py
